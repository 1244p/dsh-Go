name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /
          free -h

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk
        id: build
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log
        continue-on-error: true

      - name: report build result
        if: always()
        working-directory: app
        run: |
          echo "=== free ==="
          free -h
          echo "=== disk ==="
          df -h /
          echo "=== flutter build.log tail ==="
          tail -120 build.log 2>/dev/null || echo "no build.log"
          echo "=== apk anywhere under app ==="
          find . -name '*.apk' -exec ls -la {} \; 2>/dev/null || echo "no apk"
          echo "=== outputs tree ==="
          ls -R build/app/outputs 2>/dev/null | head -60 || echo "no outputs dir"
          echo "=== gradle daemon logs ==="
          find ~/.gradle/daemon -name '*.log' -newermt '-90 minutes' -exec tail -60 {} \; 2>/dev/null || echo "no daemon log"

      - name: upload apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/app/build.log
          retention-days: 14
          if-no-files-found: warn
