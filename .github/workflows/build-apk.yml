name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /
          free -h

      # app/android/app/build.gradle.kts:63-68 wires the packaged Linux runtime in from
      # runtime/out/<abi>/{assets,jniLibs}. That directory is a build artifact of
      # runtime/build-runtime.sh, and it is NOT checked in — so building the APK without
      # running this step first ships an app whose rootfs is missing, which the UI reports
      # as a broken/incomplete runtime bundle.
      - name: build bundled runtime (arm64-v8a)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils gpgv
          chmod +x runtime/build-runtime.sh
          # UPDATE_DEB_LOCK: the pinned noble deb set goes stale as soon as Ubuntu
          # supersedes a package (the mirror then 404s the old .deb), which fails this
          # step before Flutter ever runs. Re-resolving keeps the build alive; the chain
          # is still InRelease -> Packages.xz -> per-deb sha256.
          UPDATE_DEB_LOCK=1 COMPRESS=xz ./runtime/build-runtime.sh arm64-v8a
          echo "=== runtime out ==="
          find runtime/out -maxdepth 4 -type f -exec ls -la {} \; | head -30
          du -sh runtime/out
        timeout-minutes: 120

      # app/android/app/build.gradle.kts reads app/android/key.properties and, when it
      # exists, signs the release build with that key instead of the debug key. Without
      # it every runner mints a fresh debug certificate, so each build has a different
      # signature and every upgrade needs an uninstall first — which wipes the app's
      # stored device identity (remote server URL, host list, pairing key).
      - name: write release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — this APK will be debug-signed and cannot be installed over a release-signed build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" \
            > app/android/key.properties
          echo "=== keystore ==="
          ls -la "$RUNNER_TEMP/release.jks"
          "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" | head -6
          echo "=== key.properties (alias and path only) ==="
          grep -E '^(storeFile|keyAlias)=' app/android/key.properties

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk
        id: build
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log
        continue-on-error: true

      - name: report build result
        if: always()
        working-directory: app
        run: |
          echo "=== free ==="
          free -h
          echo "=== disk ==="
          df -h /
          echo "=== flutter build.log tail ==="
          tail -120 build.log 2>/dev/null || echo "no build.log"
          echo "=== apk anywhere under app ==="
          find . -name '*.apk' -exec ls -la {} \; 2>/dev/null || echo "no apk"
          echo "=== outputs tree ==="
          ls -R build/app/outputs 2>/dev/null | head -60 || echo "no outputs dir"
          echo "=== gradle daemon logs ==="
          find ~/.gradle/daemon -name '*.log' -newermt '-150 minutes' -exec tail -60 {} \; 2>/dev/null || echo "no daemon log"

      - name: upload apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/app/build.log
            runtime/out/arm64-v8a/build-report.json
            runtime/out/manifest.json
          retention-days: 14
          if-no-files-found: warn

      # The runner is disposable, but leave nothing behind anyway: key.properties was
      # only ever needed between "write release keystore" and the Gradle build.
      - name: scrub signing material
        if: always()
        run: |
          rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"
          echo "signing material removed"
